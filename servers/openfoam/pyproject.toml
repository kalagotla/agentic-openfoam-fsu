[project]
name = "openfoam-mcp"
version = "0.1.0"
description = "MCP server wrapping OpenFOAM CLI tools and dictionary I/O"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfoam_mcp"]

[project.scripts]
openfoam-mcp = "openfoam_mcp.__main__:main"
