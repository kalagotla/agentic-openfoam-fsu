[project]
name = "consultant-mcp"
version = "0.1.0"
description = "MCP server for consultant-style CFD reasoning: mesh-quality verdicts, tutorial annotations, scheme rationale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consultant_mcp"]

[project.scripts]
consultant-mcp = "consultant_mcp.__main__:main"
