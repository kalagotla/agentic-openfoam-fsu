[project]
name = "research-assistant-mcp"
version = "0.1.0"
description = "MCP server for OpenFOAM source-code research workflows (wmake compile loop, source-tree examples)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant_mcp"]

[project.scripts]
research-assistant-mcp = "research_assistant_mcp.__main__:main"
