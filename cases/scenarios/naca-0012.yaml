# Scenario: NACA 0012 airfoil at Re=1e6, alpha=10 deg, incompressible.
#
# STL-driven case: instead of a hand-authored blockMeshDict, the agent
# prepares an STL surface and lets snappyHexMesh carve out the geometry.
#
# Geometry: a 2-D-extruded NACA 0012 (chord = 1 m, span = 0.1 m). The
# STL is procedurally generated by
# cases/examples/naca-0012/geometry/generate_naca0012.py; re-run the
# script to change resolution, chord length, or TE closure.
#
# Laptop runtime: ~5 min meshing, ~5–10 min solving (depending on mesh
# resolution chosen).
#
# Sections follow the standard scenario order (see cases/scenarios/README.md).

name: naca-0012
description: >
  NACA 0012 airfoil at Re_c = 1e6, M = 0.15 (effectively
  incompressible), alpha = 10 degrees. Validate lift and drag
  coefficients against the XFOIL polar in
  cases/examples/naca-0012/reference/xfoil_polar.json.

# Level 2 (Review): the agent pauses after each phase for researcher
# confirmation.
automation_level: 2

physics:
  regime: incompressible
  steady: true
  flow_type: turbulent
  turbulence_model: kOmegaSST
  reynolds_number_definition: >
    Re_c = U_inf * c / nu, chord-based. With c = 1 m and nu = 1.5e-5
    m^2/s, U_inf = 15 m/s gives Re = 1e6.

geometry:
  shape: extruded-airfoil-2D
  stl_path: cases/examples/naca-0012/geometry/naca0012.stl
  patch_name: airfoil
  chord_m: 1.0
  span_m: 0.1                    # spanwise extrusion (single-cell-thick)
  # Background domain (a "C-grid lite" rectangle around the airfoil).
  # snappyHexMesh carves the airfoil out of the background blockMesh.
  background_domain:
    x_min: -10.0                 # 10 chords upstream
    x_max:  20.0                 # 20 chords downstream (capture wake)
    y_min: -10.0                 # 10 chords each side
    y_max:  10.0
    z_min: -0.05                 # span matches the STL extrusion
    z_max:  0.05
  background_cells:
    nx: 240                      # ~0.125 chord per cell at background level
    ny: 160
    nz: 1                        # 2-D case

mesh:
  strategy: snappyHexMesh
  # snappyHexMeshDict guidance — the agent decides exact refinement
  # levels and layer counts based on the target y+, but these are the
  # workshop defaults that produce ~80-150k cells.
  surface_refinement_level: [4, 5]   # min/max level on the airfoil surface
  feature_edge_refinement_level: 6   # leading/trailing edges
  layers:
    n_surface_layers: 6
    expansion_ratio: 1.2
    first_layer_thickness_m: 1.0e-4   # gives y+ ~ 30 at Re=1e6, U=15 m/s
  cells_recommended_target: 100000

fluid:
  kinematic_viscosity: 1.5e-05   # m^2/s — typical air at room conditions

flow_conditions:
  free_stream_velocity_magnitude: 15.0   # m/s
  angle_of_attack_deg: 10.0
  # The inlet patches should rotate U_inf by alpha so the airfoil sits
  # in body-fixed coordinates: U_inlet = (U*cos(alpha), U*sin(alpha), 0).

boundary_conditions:
  inlet:
    patches: [inlet]
    type: velocity-inlet         # for inflow boundaries on far-field
    # On the C-grid far-field, the agent typically labels the upstream
    # and side boundaries as 'inlet' and the downstream as 'outlet'.
    velocity_from: free_stream_velocity_and_alpha
  outlet:
    patches: [outlet]
    type: pressure-outlet
    pressure: 0.0
  airfoil:
    patches: [airfoil]           # snappyHexMesh assigns the STL surface to this patch
    type: no-slip-wall
    wall_function: kOmegaSSTWallFunctions
    target_y_plus: 30            # wall-function regime; first cell ~ 1e-4 m
  front_back:
    patches: [frontAndBack]
    type: empty                  # 2-D case (single-cell-thick)

controls:
  end_time: 2000                 # SIMPLE iterations
  write_interval: 500

validation:
  reference: cases/examples/naca-0012/reference/xfoil_polar.json
  quantitative_checks:
    # Compute Cl and Cd by integrating the forceCoeffs function object
    # output, then compare to the xfoil_polar entry at the matching alpha.
    # A single-value coefficient is compared by relative error in the
    # analysis script (compare_profiles needs >=2 points per side).
    - metric: lift_coefficient_Cl
      compare_to: xfoil_polar
      lookup_field: alpha_deg
      lookup_value: 10.0
      tolerance_relative: 0.10
    - metric: drag_coefficient_Cd
      compare_to: xfoil_polar
      lookup_field: alpha_deg
      lookup_value: 10.0
      tolerance_relative: 0.30
  qualitative_checks:
    - "residuals drop >= 3 orders of magnitude"
    - "Cp on the upper surface shows a suction peak near the leading edge"
    - "no flow separation visible at alpha = 10 deg (pre-stall)"

notes:
  expected_first_attempt: >
    A first pass with the recommended settings (snappyHexMesh defaults
    at the listed refinement levels) produces ~100k cells and a Cl
    around 1.0-1.1 vs XFOIL's 1.06. Cd typically lands at 0.013-0.018
    vs XFOIL's 0.0105 — the over-prediction is the well-known
    fully-turbulent-vs-transition gap (XFOIL uses an e^n transition
    model; this scenario does not). Both fall comfortably inside the
    tolerance bands.
  laptop_runtime: ~10-15 minutes total (meshing + solving) on 4 cores

# Post-run promotions. Both default to NO — they modify tracked content
# (the cases/examples/ baselines and the corpus) that the researcher may want
# to review by hand first. Flip to true here if you want the agent to do them
# automatically at end-of-run.
end_of_run:
  archive_case: false        # if true, openfoam.archive_case(case, scenario_name) → cases/examples/<name>/baseline/
  draft_corpus: false        # if true, consultant.draft_annotation_from_report(case, tutorial_path) → corpus/<...>.draft.md
