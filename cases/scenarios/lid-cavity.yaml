# Scenario: 2-D lid-driven cavity at Re = 400 (Ghia 1982 reference).
#
# This is the Demo 1 scenario. The corpus under corpus/ ships empty by
# design — running this case to a validated result and promoting a
# corpus/incompressible/icoFoam/cavity/cavity.md entry from the REPORT
# is the live demonstration of the build-from-runs loop.
#
# A classic CFD benchmark that the OpenFOAM tutorials library does not
# ship in this exact form: the closest tutorial is
# incompressible/icoFoam/cavity at Re=10, which uses a transient solver
# and a coarse 20x20 mesh. The agent's job is to adapt that tutorial's
# structural patterns (geometry, patch layout) to a steady, Re=400 case
# with a mesh and solver appropriate for benchmark-quality results, then
# validate the centerline velocity profiles against Ghia, Ghia & Shin
# (1982).
#
# Output: cases/work/lid-cavity/REPORT.md narrating each decision; the
# run should converge cleanly and validate within the Ghia tolerance
# band on a properly resolved mesh.
#
# Sections follow the standard scenario order (see cases/scenarios/README.md):
# physics -> geometry -> mesh -> fluid -> flow_conditions ->
# boundary_conditions -> solver -> controls -> validation -> end_of_run.

name: lid-cavity
description: >
  Two-dimensional lid-driven cavity flow at Re = 400. The top wall
  moves at unit velocity in the +x direction; the other three walls
  are no-slip. Validate the steady-state u(y) profile along the
  vertical centerline and the v(x) profile along the horizontal
  centerline against Ghia, Ghia & Shin (1982).

# Level 3 (Validate): phases run through; the agent pauses for researcher
# confirmation only at the validation step.
automation_level: 3

physics:
  regime: incompressible
  steady: true
  flow_type: laminar              # Re=400 is firmly in the steady-laminar regime
  reynolds_number_definition: >
    Re = U_lid * L / nu, where L is the cavity side length and U_lid
    is the moving-lid velocity. This is the convention used in the
    Ghia 1982 reference data and in essentially every cavity benchmark
    paper since.

geometry:
  shape: 2d-square-cavity
  side_length_m: 1.0              # cavity side L
  # The OpenFOAM cavity tutorial uses the same square geometry at L=0.1.
  # We use L=1 here so that the simulation u, v values are directly
  # comparable to Ghia's non-dimensional tabulation without rescaling.
  template_tutorial: incompressible/icoFoam/cavity

mesh:
  strategy: blockMesh             # structured grid on the square; no STL/snappy
  dimension: 2d                   # single cell in z; empty front/back patches
  # Resolution is intentionally NOT preset. Establish it by refining until the
  # centerline profiles converge toward Ghia (a grid-convergence study), per
  # the reference's tolerance rationale. Ghia's own grid is 129x129 uniform.

fluid:
  # Choose nu to give Re = U_lid * L / nu = 400 with U_lid = 1 m/s, L = 1 m.
  # The case is non-dimensional in spirit; these SI values are chosen so
  # the simulation's u, v fields are numerically equal to Ghia's
  # non-dimensional u/U_lid, v/U_lid values.
  kinematic_viscosity: 0.0025     # m^2/s

boundary_conditions:
  moving_lid:
    patches: [movingWall]
    type: velocity
    velocity: [1.0, 0.0, 0.0]     # +x direction at unit magnitude
  fixed_walls:
    patches: [fixedWalls]         # bottom, left, right
    type: no-slip-wall
  front_back:
    patches: [frontAndBack]
    type: empty                   # 2-D case

solver:
  application: simpleFoam         # steady incompressible (realises physics.steady)
  # Discretisation schemes, relaxation, and convergence controls are adopted
  # from the structural tutorial and changed only if a check fails — not
  # preset here.

controls:
  # End-time is the iteration count for the steady SIMPLE loop.
  end_time: 5000
  write_interval: 1000

validation:
  # The benchmark dataset this case is scored against.
  reference: cases/lid-cavity/reference/ghia_1982.json

  # Analysis spec: which agent-authored script runs, against which reference,
  # and the human-readable acceptance intent. The YAML declares intent, not
  # mechanism — a fixed tool/metric vocabulary cannot span the validation
  # space (Cd/Cl, Cp, Cf, reattachment, Strouhal, Nusselt, shock angle,
  # spectra), so the script owns the case-specific extraction + math and
  # compare_profiles owns the verdict. The agent runs the script via
  # validation.run_analysis(case_path, script=...).
  analysis:
    script: analysis/validate.py    # case-relative; the agent authors it
    args: []                        # optional argv forwarded to the script
    timeout_s: 120                  # optional; defaults to the tool default

    # Human-readable acceptance intent — what "pass" means, for the reviewer
    # and the agent authoring the script. The script computes the verdict via
    # compare_profiles; these rows are documentation, not executed.
    checks:
      - quantity: u_centerline               # u(y) sampled at x = 0.5
        reference_dataset: ghia_re_400_u_centerline
        tolerance_relative_L2: 0.05
      - quantity: v_centerline               # v(x) sampled at y = 0.5
        reference_dataset: ghia_re_400_v_centerline
        tolerance_relative_L2: 0.05

  qualitative_checks:               # free-text sanity checks
    - "residuals drop >= 4 orders of magnitude"
    - "primary vortex visible centered near (x ~ 0.55, y ~ 0.60)"
    - "two secondary vortices visible in the lower corners"

# Post-run promotions. Both default to NO — they modify tracked content
# (the cases/examples/ baselines and the corpus) that the researcher may want
# to review by hand first. Flip to true here if you want the agent to do them
# automatically at end-of-run.
end_of_run:
  archive_case: true        # if true, openfoam.archive_case(case, scenario_name) → cases/examples/<name>/baseline/
  draft_corpus: true        # if true, consultant.draft_annotation_from_report(case, tutorial_path) → corpus/<...>.draft.md
