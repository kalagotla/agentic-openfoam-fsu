# Scenario: laminar backward-facing step (pitzDaily geometry), validated
# against Armaly et al. (1983). Sections follow cases/scenarios/README.md.
name: pitz-daily
description: >
  Backward-facing step in the pitzDaily geometry. Run the case as
  specified and validate the simulated reattachment length against the
  Armaly 1983 reference.

automation_level: 2

physics:
  regime: incompressible
  steady: true
  flow_type: laminar
  reynolds_number_definition: >
    Re_h = 2 * U_mean * h / nu  (Armaly hydraulic-diameter convention;
    D_h = 2h for the inlet channel where the channel height equals the
    step height), the convention of the reference data. Not U*h/nu.

geometry:
  shape: backward-facing-step
  template_tutorial: incompressible/simpleFoam/pitzDaily
  # Step and inlet-channel heights are fixed properties of the rig, not
  # free parameters: do not change h to match a Reynolds number.
  step_height_m: 0.0254
  inlet_channel_height_m: 0.0254     # = h (D_h = 2h convention)
  post_step_length_min_h: 20         # straight downstream section, no contraction

mesh:
  strategy: blockMesh
  template: $FOAM_TUTORIALS/incompressible/simpleFoam/pitzDaily/system/blockMeshDict

fluid:
  kinematic_viscosity: 1.0e-05  # m^2/s

boundary_conditions:
  inlet:
    patches: [inlet]
    type: velocity-inlet
    profile: parabolic-fully-developed   # U(y) = 6 U_mean y (h - y) / h^2
    mean_velocity: 0.157          # m/s, streamwise
    flow_direction: [1.0, 0.0, 0.0]
  outlet:
    patches: [outlet]
    type: pressure-outlet
    pressure: 0.0
  walls:
    patches: [upperWall, lowerWall]
    type: no-slip-wall
  front_back:
    patches: [frontAndBack]
    type: empty                   # 2D case

controls:
  end_time: 2000             # iterations of the steady loop
  write_interval: 500

validation:
  reference: cases/examples/pitz-daily/reference/reattachment_length.json
  quantitative_checks:
    # x_r/h: reattachment point on the lower wall (wall-shear sign change),
    # computed by the agent-authored analysis script.
    - metric: reattachment_length_x_r_over_h
      compare_to: armaly_re_800
      tolerance_h: 1.5
      # +/-1.5 h allows for the 2-D simulation vs 3-D experiment offset
      # (Erturk 2008, Comput. Fluids 37; Williams & Baker 1997).
  qualitative_checks:
    - "residuals drop >= 3 orders of magnitude"
    - "recirculation bubble visible behind step in U field"

end_of_run:
  archive_case: false        # if true, openfoam.archive_case(case, scenario_name) → cases/examples/<name>/baseline/
  draft_corpus: false        # if true, consultant.draft_annotation_from_report(case, tutorial_path) → corpus/<...>.draft.md
