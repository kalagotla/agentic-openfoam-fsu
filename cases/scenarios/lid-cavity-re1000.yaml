# Scenario: 2-D lid-driven cavity at Re = 1000, validated against
# Ghia, Ghia & Shin (1982). Sections follow cases/scenarios/README.md.

name: lid-cavity-re1000
description: >
  Two-dimensional lid-driven cavity flow at Re = 1000. The top wall
  moves at unit velocity in the +x direction; the other three walls are
  no-slip. Validate the centerline u(y) and v(x) profiles against the Re=1000
  reference columns.

automation_level: 2

physics:
  regime: incompressible
  steady: true
  flow_type: laminar
  reynolds_number_definition: "Re = U_lid * L / nu = 1000"

geometry:
  shape: 2d-square-cavity
  side_length_m: 1.0
  template_tutorial: incompressible/icoFoam/cavity

mesh:
  strategy: blockMesh
  dimension: 2d

fluid:
  kinematic_viscosity: 0.001      # nu = U_lid * L / Re = 1 * 1 / 1000

boundary_conditions:
  moving_lid:  { patches: [movingWall],   type: velocity, velocity: [1.0, 0.0, 0.0] }
  fixed_walls: { patches: [fixedWalls],   type: no-slip-wall }
  front_back:  { patches: [frontAndBack], type: empty }

solver:
  application: simpleFoam

controls:
  end_time: 5000
  write_interval: 1000

validation:
  reference: cases/lid-cavity/reference/ghia_1982.json
  analysis:
    script: analysis/validate.py
    checks:
      - quantity: u_centerline               # u(y) sampled at x = 0.5
        reference_dataset: ghia_re_1000_u_centerline
        tolerance_relative_L2: 0.05
      - quantity: v_centerline               # v(x) sampled at y = 0.5
        reference_dataset: ghia_re_1000_v_centerline
        tolerance_relative_L2: 0.05
  qualitative_checks:
    - "residuals drop >= 4 orders of magnitude"
    - "primary vortex visible centered near (x ~ 0.53, y ~ 0.56)"
    - "two secondary vortices visible in the lower corners"

end_of_run:
  archive_case: false
  draft_corpus: false
