# Codex CLI project config: the four MCP servers (same as .mcp.json).
# Codex reads this only for trusted projects; setup.sh marks the repo
# trusted in ~/.codex/config.toml. Run `codex` from the repo root.

[mcp_servers.openfoam]
command = "scripts/with-openfoam.sh"
args = ["uv", "run", "--package", "openfoam-mcp", "python", "-m", "openfoam_mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 3600

[mcp_servers.validation]
command = "uv"
args = ["run", "--package", "validation-mcp", "python", "-m", "validation_mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 600

[mcp_servers.consultant]
command = "uv"
args = ["run", "--package", "consultant-mcp", "python", "-m", "consultant_mcp"]
startup_timeout_sec = 60

[mcp_servers.research_assistant]
command = "scripts/with-openfoam.sh"
args = ["uv", "run", "--package", "research-assistant-mcp", "python", "-m", "research_assistant_mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 1800
